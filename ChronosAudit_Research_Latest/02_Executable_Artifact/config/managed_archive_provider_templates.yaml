version: 1.0.0
providers:
  - provider_id: alchemy
    operator_family: alchemy
    api_key_env: CHRONOS_ALCHEMY_API_KEY
    operator_evidence_url: https://www.alchemy.com/docs/reference/chain-apis-overview
    chains:
      ethereum:
        chain_id: "0x1"
        endpoint_template: https://eth-mainnet.g.alchemy.com/v2/{api_key}
      bsc:
        chain_id: "0x38"
        endpoint_template: https://bnb-mainnet.g.alchemy.com/v2/{api_key}
      base:
        chain_id: "0x2105"
        endpoint_template: https://base-mainnet.g.alchemy.com/v2/{api_key}
      arbitrum:
        chain_id: "0xa4b1"
        endpoint_template: https://arb-mainnet.g.alchemy.com/v2/{api_key}
  - provider_id: infura
    operator_family: infura
    api_key_env: CHRONOS_INFURA_API_KEY
    operator_evidence_url: https://docs.infura.io/get-started/endpoints/
    chains:
      ethereum:
        chain_id: "0x1"
        endpoint_template: https://mainnet.infura.io/v3/{api_key}
      bsc:
        chain_id: "0x38"
        endpoint_template: https://bsc-mainnet.infura.io/v3/{api_key}
      base:
        chain_id: "0x2105"
        endpoint_template: https://base-mainnet.infura.io/v3/{api_key}
      arbitrum:
        chain_id: "0xa4b1"
        endpoint_template: https://arbitrum-mainnet.infura.io/v3/{api_key}
