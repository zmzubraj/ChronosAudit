    chain: ethereum
    endpoint: https://ethereum-rpc.publicnode.com
    operator_family: publicnode
    discovery_source: https://ethereum-rpc.publicnode.com/
    tracking_enabled: true
    operator_evidence_url: https://www.publicnode.com/
    operator_evidence_sha256:
    operator_verified: false
