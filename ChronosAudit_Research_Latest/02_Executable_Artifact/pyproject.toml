[project]
name = "chronosaudit-stage2"
version = "0.5.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "pyarrow>=22.0.0,<23.0.0",
]

[dependency-groups]
dev = ["pytest>=8.4.1,<9.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
