<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Temporal eligibility</title>
  <desc id="desc">Bar chart of the fraction of benchmark contracts that existed at one hour, 24 hours, seven days, and 30 days before the recorded incident, with Wilson 95 percent intervals.</desc>
  <rect width="100%" height="100%" fill="white"/>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#111} .axis{stroke:#111;stroke-width:2} .grid{stroke:#ddd;stroke-width:1} .tick{font-size:20px} .label{font-size:23px} .title{font-size:28px;font-weight:700} .value{font-size:20px;font-weight:700}</style>
  <text x="600.0" y="52.0" class="title" text-anchor="middle">Contract existence at pre-incident landmarks</text>
  <line x1="130" y1="670.0" x2="1150" y2="670.0" class="grid"/>
  <text x="114.0" y="677.0" class="tick" text-anchor="end">0%</text>
  <line x1="130" y1="527.5" x2="1150" y2="527.5" class="grid"/>
  <text x="114.0" y="534.5" class="tick" text-anchor="end">25%</text>
  <line x1="130" y1="385.0" x2="1150" y2="385.0" class="grid"/>
  <text x="114.0" y="392.0" class="tick" text-anchor="end">50%</text>
  <line x1="130" y1="242.5" x2="1150" y2="242.5" class="grid"/>
  <text x="114.0" y="249.5" class="tick" text-anchor="end">75%</text>
  <line x1="130" y1="100.0" x2="1150" y2="100.0" class="grid"/>
  <text x="114.0" y="107.0" class="tick" text-anchor="end">100%</text>
  <line x1="130" y1="100" x2="130" y2="670" class="axis"/>
  <line x1="130" y1="670" x2="1150" y2="670" class="axis"/>
  <text x="38.0" y="385.0" class="label" text-anchor="middle" transform="rotate(-90 38.0 385.0)">Eligible fraction (N=417)</text>
  <rect x="186.1" y="100.0" width="142.8" height="570.0" fill="#0072B2" stroke="#111" stroke-width="2"/>
  <line x1="257.5" y1="105.2" x2="257.5" y2="100.0" stroke="#111" stroke-width="3"/>
  <line x1="245.5" y1="105.2" x2="269.5" y2="105.2" stroke="#111" stroke-width="3"/>
  <line x1="245.5" y1="100.0" x2="269.5" y2="100.0" stroke="#111" stroke-width="3"/>
  <text x="257.5" y="82.0" class="value" text-anchor="middle">417/417</text>
  <text x="257.5" y="708.0" class="label" text-anchor="middle">1 hour</text>
  <rect x="441.1" y="100.0" width="142.8" height="570.0" fill="#0072B2" stroke="#111" stroke-width="2"/>
  <line x1="512.5" y1="105.2" x2="512.5" y2="100.0" stroke="#111" stroke-width="3"/>
  <line x1="500.5" y1="105.2" x2="524.5" y2="105.2" stroke="#111" stroke-width="3"/>
  <line x1="500.5" y1="100.0" x2="524.5" y2="100.0" stroke="#111" stroke-width="3"/>
  <text x="512.5" y="82.0" class="value" text-anchor="middle">417/417</text>
  <text x="512.5" y="708.0" class="label" text-anchor="middle">24 hours</text>
  <rect x="696.1" y="188.8" width="142.8" height="481.2" fill="#0072B2" stroke="#111" stroke-width="2"/>
  <line x1="767.5" y1="210.5" x2="767.5" y2="170.8" stroke="#111" stroke-width="3"/>
  <line x1="755.5" y1="210.5" x2="779.5" y2="210.5" stroke="#111" stroke-width="3"/>
  <line x1="755.5" y1="170.8" x2="779.5" y2="170.8" stroke="#111" stroke-width="3"/>
  <text x="767.5" y="170.8" class="value" text-anchor="middle">352/417</text>
  <text x="767.5" y="708.0" class="label" text-anchor="middle">7 days</text>
  <rect x="951.1" y="294.1" width="142.8" height="375.9" fill="#0072B2" stroke="#111" stroke-width="2"/>
  <line x1="1022.5" y1="320.8" x2="1022.5" y2="269.1" stroke="#111" stroke-width="3"/>
  <line x1="1010.5" y1="320.8" x2="1034.5" y2="320.8" stroke="#111" stroke-width="3"/>
  <line x1="1010.5" y1="269.1" x2="1034.5" y2="269.1" stroke="#111" stroke-width="3"/>
  <text x="1022.5" y="276.1" class="value" text-anchor="middle">275/417</text>
  <text x="1022.5" y="708.0" class="label" text-anchor="middle">30 days</text>
</svg>
